# Bản thay thế docker/apache-performance.conf cho VPS 2 GB RAM (mount qua compose.vps.yaml).
# Phần cache/gzip giữ nguyên; chỉ hạ prefork: mỗi tiến trình PHP ~40–60 MB, 20 tiến trình
# sẵn sàng như bản gốc là 1 GB — quá nửa RAM máy. Nginx phía trước đã giữ kết nối chậm.
ServerName localhost

<IfModule mod_expires.c>
    ExpiresActive On
</IfModule>
<LocationMatch "^/build/assets/">
    Header set Cache-Control "public, max-age=31536000, immutable"
    <IfModule mod_expires.c>
        ExpiresDefault "access plus 1 year"
    </IfModule>
</LocationMatch>
<LocationMatch "^/storage/">
    Header set Cache-Control "public, max-age=86400"
    <IfModule mod_expires.c>
        ExpiresDefault "access plus 1 day"
    </IfModule>
</LocationMatch>

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml text/calendar
    AddOutputFilterByType DEFLATE text/javascript application/javascript application/x-javascript
    AddOutputFilterByType DEFLATE application/json application/geo+json application/ld+json application/xml
    AddOutputFilterByType DEFLATE image/svg+xml font/ttf font/otf application/vnd.ms-fontobject
    Header append Vary Accept-Encoding env=!dont-vary
</IfModule>

<IfModule mpm_prefork_module>
    StartServers              2
    MinSpareServers           2
    MaxSpareServers           4
    MaxRequestWorkers         8
    MaxConnectionsPerChild 2000
</IfModule>

KeepAlive On
KeepAliveTimeout 3
MaxKeepAliveRequests 200
