# /etc/nginx/sites-available/disanso.conf — deploy.sh thay DISANSO_DOMAIN và DISANSO_PORT rồi cài.
# Site cho nginx CỦA MÁY CHỦ; app chỉ publish ra 127.0.0.1:DISANSO_PORT (compose.vps.yaml).
upstream disanso_app { server 127.0.0.1:DISANSO_PORT; }

server {
    listen 80;
    server_name DISANSO_DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name DISANSO_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DISANSO_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DISANSO_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Khớp post_max_size=25M của PHP; nhỏ hơn thì nginx chặn upload trước khi tới app.
    client_max_body_size 25m;
    proxy_read_timeout 60s;

    # Không thêm add_header: Apache trong image đã đặt nosniff/CSP (docker/apache-security.conf).
    location / {
        proxy_pass http://disanso_app;
        # Giữ Host để Laravel sinh URL đúng; X-Forwarded-Proto để cookie có cờ Secure.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Ghi đè (không nối) để máy khách không tự khai IP giả qua header này.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
