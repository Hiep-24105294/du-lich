# Nền tảng số hóa và diễn giải di sản văn hóa đa ngữ (DiSanSo) – CSE703073 ĐT-04
# Chạy: docker compose up --build   (lần đầu ~5-10 phút để tải image và build)
# Web:  http://localhost:8080   Python: http://localhost:8001/docs   MySQL: localhost:3307
services:
  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-disanso}
      MYSQL_USER: ${DB_USERNAME:-disanso}
      MYSQL_PASSWORD: ${DB_PASSWORD:-disanso_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 12

  analytics:
    build: ./python-service
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-disanso}
      DB_USERNAME: ${DB_USERNAME:-disanso}
      DB_PASSWORD: ${DB_PASSWORD:-disanso_secret}
      ANALYTICS_TOKEN: ${ANALYTICS_TOKEN:-dev-analytics-token}
    ports:
      - "${ANALYTICS_FORWARD_PORT:-8001}:8001"
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: ./app
      dockerfile: docker/Dockerfile
    environment:
      APP_NAME: DiSanSo
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_KEY: ${APP_KEY:-}
      APP_LOCALE: vi
      APP_FALLBACK_LOCALE: en
      LOG_CHANNEL: stack
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-disanso}
      DB_USERNAME: ${DB_USERNAME:-disanso}
      DB_PASSWORD: ${DB_PASSWORD:-disanso_secret}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      SESSION_DRIVER: database
      SESSION_LIFETIME: 120
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      ANALYTICS_URL: http://analytics:8001
      ANALYTICS_TOKEN: ${ANALYTICS_TOKEN:-dev-analytics-token}
      PAYMENT_GATEWAY: sandbox
      PAYMENT_SANDBOX_SECRET: ${PAYMENT_SANDBOX_SECRET:-sandbox-secret-change-me}
      BOOKING_HOLD_MINUTES: 10
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-DiSan@2026}
      TRUSTED_PROXIES: "*"
    ports:
      - "${APP_FORWARD_PORT:-8080}:80"
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
      analytics:
        condition: service_started

volumes:
  db_data:
  app_storage:
  app_logs:
